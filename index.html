<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JRA予想ラボ</title><style>body{margin:0;background:#eef3f4;color:#18303d;font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{background:#143443;color:white;padding:22px}main{max-width:700px;margin:auto;padding:14px}section{background:white;padding:16px;margin:12px 0;border-radius:12px}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0 0 12px}label{display:block;margin:10px 0 4px;font-size:13px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #b8c9d0;border-radius:8px;padding:10px;font:inherit}textarea{height:170px;font-size:13px}button{background:#08766c;color:white;border:0;border-radius:9px;padding:13px 18px;font-weight:bold;font-size:16px;margin:10px 5px 5px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{font-size:13px;color:#526d78;line-height:1.6}.warn{background:#fff2d8;padding:10px;border-radius:8px}.horse{padding:10px;border-bottom:1px solid #ddd}.mark{color:#b45118;font-weight:bold}#status{color:#08766c;font-size:14px}a{color:#08766c}</style></head><body><header><h1>🏇 JRA予想ラボ</h1><small>中央競馬専用・試作版 v0.4</small></header><main><section><h2>レース設定</h2><div class="grid"><div><label>開催日</label><input type="date" id="date"></div><div><label>競馬場</label><select id="course"><option>東京</option><option>中山</option><option>京都</option><option>阪神</option><option>中京</option><option>新潟</option><option>福島</option><option>小倉</option><option>札幌</option><option>函館</option></select></div><div><label>レース</label><select id="race"></select></div><div><label>馬場</label><select id="going"><option>良</option><option>稍重</option><option>重</option><option>不良</option></select></div><div><label>コース</label><select id="surface"><option>ダート</option><option>芝</option></select></div><div><label>距離（m）</label><input type="number" id="distance" value="1800"></div></div></section><section><h2>出走馬を入力</h2><p class="hint warn">以下は架空のテストデータです。JRAの出走表・オッズはまだ自動取得できません。</p><p class="hint">1行ずつ「馬番,馬名,単勝オッズ,脚質,父,斤量,近走評価(0〜100)」を入力してください。脚質は逃げ・先行・差し・追込。</p><textarea id="horses">1,サンプルA,4.2,先行,シニスターミニスター,57,76
2,サンプルB,7.8,差し,キズナ,57,80
3,サンプルC,12.5,逃げ,ヘニーヒューズ,56,68
4,サンプルD,3.1,追込,ドゥラメンテ,58,82
5,サンプルE,19.0,先行,シニスターミニスター,55,72</textarea><button id="analyze">予想を分析する</button><button id="clear" style="background:#687d87">入力を消去</button><p id="status">読み込み中...</p></section><section id="result" hidden><h2>最終予想</h2><div id="predictions"></div><p id="pace" class="hint"></p><button id="copy">印をコピー</button><button id="save" style="background:#687d87">履歴に保存</button></section><section><h2>予想履歴</h2><div id="history" class="hint">保存履歴なし</div></section><section><h2>ご注意</h2><p class="hint">JRA非公式の試作品です。近走評価など手入力値に基づく簡易スコアで、AI学習済みの予測ではありません。的中・利益を保証しません。実際の馬番・馬名・オッズは<a href="https://www.jra.go.jp/">JRA公式サイト</a>で確認してください。</p></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let latest='';const d=new Date();$('date').value=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');for(let i=1;i<=12;i++)$('race').add(new Option(i+'R',i));$('status').textContent='計算機能の読み込み完了';function showHistory(){try{const h=JSON.parse(localStorage.getItem('jra-history')||'[]');$('history').textContent=h.join('\n')||'保存履歴なし';$('history').style.whiteSpace='pre-wrap'}catch(e){$('history').textContent='履歴を読み込めません'}}showHistory();$('analyze').onclick=()=>{try{const lines=$('horses').value.trim().split(/\r?\n/).filter(Boolean);if(lines.length<2)throw Error('2頭以上入力してください');const seen=new Set();const horses=lines.map((line,i)=>{const p=line.split(',').map(x=>x.trim());if(p.length!==7)throw Error((i+1)+'行目は7項目必要です');const [n,name,odds,style,sire,weight,form]=p;const num=Number(n),o=Number(odds),w=Number(weight),f=Number(form);if(!Number.isInteger(num)||num<1||num>18||seen.has(num))throw Error('馬番が不正・重複しています');seen.add(num);if(!name||!['逃げ','先行','差し','追込'].includes(style)||!(o>1)||!(w>=45&&w<=65)||!(f>=0&&f<=100))throw Error((i+1)+'行目の入力が不正です');return {num,name,odds:o,style,sire,weight:w,form:f}});const front=horses.filter(h=>['逃げ','先行'].includes(h.style)).length,fast=front>=Math.ceil(horses.length*.55),slow=front<=1;horses.forEach(h=>{h.score=h.form*.8+Math.max(-5,Math.min(5,(57-h.weight)*1.1))+(fast&&['差し','追込'].includes(h.style)?4:0)+(slow&&['逃げ','先行'].includes(h.style)?4:0)+($('surface').value==='ダート'&&h.sire==='シニスターミニスター'?2:0)});horses.sort((a,b)=>b.score-a.score);const marks=['◎','○','▲','☆','△','△','△'];latest=horses.slice(0,7).map((h,i)=>(marks[i]||'△')+h.num+'番'+h.name).join(' / ');$('predictions').innerHTML=horses.map((h,i)=>'<div class="horse"><span class="mark">'+(marks[i]||'・')+'</span> '+esc(h.num+'番 '+h.name)+' <small>('+h.score.toFixed(1)+'点 / '+h.odds+'倍)</small></div>').join('');$('pace').textContent='展開予想：'+(fast?'ハイペース寄り':slow?'スローペース寄り':'平均ペース')+'。簡易的な脚質数による判定です。';$('result').hidden=false;$('status').textContent='分析完了';$('result').scrollIntoView({behavior:'smooth'});}catch(e){$('status').textContent='エラー：'+e.message;$('result').hidden=true}};$('clear').onclick=()=>{$('horses').value='';$('status').textContent='入力を消去しました';$('result').hidden=true};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(latest);$('status').textContent='コピーしました'}catch(e){$('status').textContent='コピーできませんでした'}};$('save').onclick=()=>{try{const h=JSON.parse(localStorage.getItem('jra-history')||'[]');h.unshift($('date').value+' '+$('course').value+$('race').value+'R '+latest);localStorage.setItem('jra-history',JSON.stringify(h.slice(0,20)));showHistory();$('status').textContent='保存しました'}catch(e){$('status').textContent='保存できませんでした'}}};
})();
</script></body></html>
