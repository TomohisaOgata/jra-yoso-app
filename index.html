<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffe2e9"><meta name="apple-mobile-web-app-capable" content="yes"><title>ダービー牧場</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(#ffe6ef,#f8fff0);color:#55372e;min-height:100dvh}main{max-width:560px;margin:auto;padding:18px 16px 100px}h1{text-align:center;font-size:28px;margin:12px 0 18px}.panel{background:#fffdfb;border:2px solid #f5d6db;border-radius:23px;padding:18px;margin:13px 0;box-shadow:0 7px 18px #b45b6520}.horse{position:relative;text-align:center;background:linear-gradient(#d9f6ff 0 60%,#c4e5ad 60%);border-radius:22px;padding:22px 0 12px;overflow:hidden}.horse .emoji{font-size:112px;line-height:1.3;display:block;filter:drop-shadow(3px 6px 3px #6c774944)}.horse .flowers{position:absolute;top:8px;width:100%;font-size:23px}.horse .heart{font-size:22px}input{width:100%;font-size:20px;border:1px solid #e5bec5;border-radius:12px;padding:12px;background:white}button{border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:#f7a8b8;color:#54272f;cursor:pointer}button:active{transform:scale(.97)}button:disabled{opacity:.45}.primary{background:#f27798;color:white}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;gap:10px}.stat{display:flex;align-items:center;gap:8px;font-weight:650}.stat span{width:110px}.stat progress{flex:1;accent-color:#e97d97;height:15px}.stat b{width:30px;text-align:right}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdfbf2;display:flex;justify-content:center;padding:10px 8px max(12px,env(safe-area-inset-bottom));border-top:1px solid #f2c9d2}.nav button{background:transparent;width:33%;max-width:170px}.nav button.active{background:#fbd4df}.hidden{display:none}.race{padding:13px 0;border-bottom:1px solid #f3dce0}.race:last-child{border:0}.race small{display:block;color:#8b7770;margin:7px 0}.track{height:210px;background:repeating-linear-gradient(#c3e8a6 0 50px,#b0dc8e 50px 53px);border-radius:16px;overflow:hidden;margin:14px 0}.runner{font-size:36px;height:51px;position:relative;left:0;transition:left 5s linear;white-space:nowrap}.runner.go{left:calc(100% - 65px)}.message{text-align:center;background:#fff3c9;padding:12px;border-radius:12px;margin-top:14px}.badge{display:inline-block;background:#ffe6b2;border-radius:30px;padding:5px 10px;font-size:14px}#raceScene{position:fixed;inset:0;background:#fff7f9;z-index:5;padding:30px 16px;overflow:auto}#raceScene .wrap{max-width:560px;margin:auto;text-align:center}
</style><style id="horse-redesign">
body{background:linear-gradient(145deg,#31475e,#f3d1a9 48%,#e7b777);color:#4a3027}main{max-width:960px;padding:12px 12px 120px}h1{color:#fff8dd;text-shadow:0 3px 4px #3e2c2b;font-size:clamp(25px,5vw,42px);margin:10px 0}.panel{background:#fff7efed;border:3px solid #f3c8a5;box-shadow:0 8px 20px #513c3540}#home>.panel{padding:12px;background:linear-gradient(135deg,#fff4e3,#fff5f2)}
#home .horse{height:clamp(280px,53vw,470px);background:linear-gradient(160deg,#74543e99,#e8b88620),linear-gradient(#f4c7d2 0 40%,#a7cfa3 41% 74%,#d2ac71 75%);border:6px solid #b97c4c;box-shadow:inset 0 0 0 4px #f8e0b5;overflow:hidden}#home .horse:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22%,#8c5d3980 22% 24%,transparent 24% 47%);pointer-events:none}#home .horse .flowers{font-size:30px;letter-spacing:12px;z-index:2}#home .horse .emoji{font-size:clamp(165px,36vw,300px);position:relative;z-index:1;display:inline-block;transform-origin:50% 85%;animation:horse-bob 2.4s ease-in-out infinite;filter:drop-shadow(5px 10px 4px #59412a70)}#home .horse .heart{position:relative;z-index:2;animation:heart-float 2s ease-in-out infinite}#home .horse.happy .emoji{animation:horse-happy .55s ease-in-out 3}#home .horse.happy .heart{font-size:34px}
@keyframes horse-bob{0%,100%{transform:translateY(5px) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}@keyframes horse-happy{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(8deg) translateY(-20px)}}@keyframes heart-float{50%{transform:translateY(-10px)}}
#home input{font-size:24px;font-weight:800;color:#6d382f;background:#fff6fa;border:3px solid #e7a4b7;text-align:center;margin-bottom:12px}#home .stats{background:#fffaf4;border:2px solid #e8c5a9;border-radius:18px;padding:15px}#home .stat span{width:120px}#home .stat progress{height:22px}#home #meta{font-weight:800;text-align:center;background:#fff0d5;border-radius:14px;padding:13px}#home .badge{background:linear-gradient(90deg,#4f8ff0,#8c70e5);color:white;font-size:16px;padding:9px 18px}#home button{box-shadow:0 4px 0 #c36b78;font-size:17px}#home .home-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}#home .home-actions button:nth-child(1){background:#8ee05d}#home .home-actions button:nth-child(2){background:#7ecaf7}#home .home-actions button:nth-child(3){background:#cda6ff}#home .home-actions button:nth-child(4){background:#ffca65}.nav{background:#263c54f5;border-top:3px solid #e5bd85}.nav button{color:#fff8e9;font-weight:800}.nav button.active{background:#e97b9d;color:white}
@media(min-width:700px){#home>.panel{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}#home>.panel>input{grid-column:1/-1}#home>.panel>.horse{grid-row:2/7}#home>.panel>.home-actions{grid-column:1/-1}}
</style><style id="pony-svg-style">#pony{animation:pony-bob 2.2s ease-in-out infinite;transform-origin:50% 75%}#pony .pony-tail{animation:pony-tail 1.3s ease-in-out infinite alternate;transform-origin:76% 58%}#pony .pony-head{animation:pony-head 3s ease-in-out infinite;transform-origin:50% 70%}#home .horse.happy #pony{animation:pony-jump .55s ease-in-out 3}@keyframes pony-bob{0%,100%{transform:translateY(3px) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}@keyframes pony-tail{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}@keyframes pony-head{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@keyframes pony-jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px) rotate(3deg)}}@media(prefers-reduced-motion:reduce){#pony,#pony *{animation:none!important}}</style></head><body><main><h1>🌸 ダービー牧場 🌸</h1><section id="home"><div class="panel"><input id="name" aria-label="愛馬の名前" maxlength="20"><div class="horse"><div class="flowers">🌸 🌼 🌸 🌼 🌸</div><svg id="pony" viewBox="0 0 300 300" role="img" aria-label="可愛い栗毛の愛馬" style="width:min(90%,340px);height:90%;position:relative;z-index:1;overflow:visible;filter:drop-shadow(4px 12px 6px #66472d77)"><defs><linearGradient id="coat" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f4b66c"/><stop offset="1" stop-color="#b86a3a"/></linearGradient></defs><ellipse cx="145" cy="274" rx="83" ry="11" fill="#536f45" opacity=".25"/><g class="pony-tail"><path d="M211 156 Q291 131 260 224 Q255 237 243 237 Q257 185 215 190Z" fill="#77472e"/></g><path d="M96 187 Q83 223 94 271 L124 271 Q123 231 143 202Z" fill="#b97241"/><path d="M182 184 Q207 222 194 271 L226 271 Q232 214 207 182Z" fill="#b76b3c"/><ellipse cx="155" cy="179" rx="77" ry="65" fill="url(#coat)"/><path d="M108 195 Q101 230 108 271 L137 271 Q137 229 153 206Z" fill="#d88a4e"/><path d="M184 198 Q193 238 183 271 L213 271 Q222 226 204 194Z" fill="#cb7c45"/><g class="pony-head"><path d="M99 108 Q88 64 105 56 Q123 62 132 103Z" fill="#87482d"/><path d="M177 99 Q177 60 193 53 Q210 65 196 112Z" fill="#8b492e"/><path d="M107 99 Q98 70 106 68 Q118 76 121 104Z" fill="#f4a0a0"/><path d="M185 96 Q184 71 193 68 Q201 77 193 104Z" fill="#efa09a"/><path d="M94 119 Q84 82 117 76 Q154 58 184 84 Q219 112 212 163 Q207 213 157 220 Q110 216 93 172 Q83 140 94 119Z" fill="url(#coat)"/><path d="M92 119 Q82 91 100 80 Q109 61 131 75 Q151 55 175 83 Q151 77 139 98 Q118 87 111 113Z" fill="#78452f"/><path d="M149 87 Q161 111 155 145 L169 164 Q161 181 150 177 Q140 149 145 128Z" fill="#fff6e7"/><ellipse cx="151" cy="185" rx="59" ry="36" fill="#eeb99c"/><ellipse cx="124" cy="183" rx="5" ry="7" fill="#a76858"/><ellipse cx="179" cy="183" rx="5" ry="7" fill="#a76858"/><path d="M137 202 Q154 213 172 200" stroke="#995f4c" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="115" cy="142" rx="12" ry="16" fill="#392b2a"/><ellipse cx="186" cy="142" rx="12" ry="16" fill="#392b2a"/><ellipse cx="119" cy="136" rx="5" ry="6" fill="white"/><ellipse cx="190" cy="136" rx="5" ry="6" fill="white"/><ellipse cx="99" cy="164" rx="13" ry="8" fill="#e98c87" opacity=".7"/><ellipse cx="202" cy="164" rx="13" ry="8" fill="#e98c87" opacity=".7"/><path d="M101 155 Q151 179 204 151" stroke="#e24b75" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M205 143 L213 185" stroke="#e24b75" stroke-width="8" fill="none"/></g></svg><div class="heart">💕 💕 💕</div></div><p style="text-align:center"><span class="badge" id="typeLabel"></span></p><div class="stats" id="stats"></div><p id="meta"></p><div class="home-actions"><button onclick="feed()">🥕 お世話</button><button onclick="tab('train')">🏋️ 調教</button><button onclick="rest()">🛏️ 休養</button><button onclick="tab('races')">🏆 レース出走</button></div><div class="panel" style="background:#fff6e9"><strong>📅 今日の牧場</strong><p id="daily"></p><button onclick="dailyBonus()">🎁 今日のログインボーナス</button></div><button class="primary" style="width:100%" onclick="pet()">🥕 なでなでする</button></div></section><section id="train" class="hidden"><div class="panel"><h2>🏋️ 調教</h2><p>体力を使って能力アップ！</p><div class="actions"><button onclick="train('speed')">⚡ スピード調教</button><button onclick="train('power')">🔥 パワー調教</button><button onclick="train('stamina')">🌿 スタミナ調教</button><button onclick="rest()">🌱 放牧・休養</button></div><h3>🏇 育成メニュー</h3><div class="actions"><button onclick="feed()">🥕 ニンジン（100コイン）</button><button onclick="specialTrain()">⭐ 特訓（300コイン）</button></div><h3>愛馬のタイプ</h3><div class="actions"><button onclick="changeType('speed')">⚡ スピード</button><button onclick="changeType('power')">🔥 パワー</button><button onclick="changeType('stamina')">🌿 スタミナ</button></div><p>⚡ スピード → 🌿 スタミナ → 🔥 パワー → ⚡ スピード</p></div></section><section id="races" class="hidden"><div class="panel"><h2>🏆 JRA主要GIレース</h2><p>2026年のJRA主要GIを参考にしたゲーム内レースです。出走には体力20が必要です。</p><p>タイプ相性：⚡→🌿→🔥→⚡</p><div id="raceList"></div></div></section><div class="message" id="message" role="status"></div></main><nav class="nav"><button class="active" data-tab="home" onclick="tab('home')">💕 愛馬</button><button data-tab="train" onclick="tab('train')">🏋️ 調教</button><button data-tab="races" onclick="tab('races')">🏇 レース</button></nav><div id="raceScene" class="hidden"><div class="wrap"><h2 id="raceTitle"></h2><p id="commentary">まもなくスタート！</p><div class="track"><div class="runner">🐎 <small>あなた</small></div><div class="runner">🐎 <small>ライバルA</small></div><div class="runner">🐎 <small>ライバルB</small></div><div class="runner">🐎 <small>ライバルC</small></div></div><button id="finish" class="primary" style="display:none" onclick="closeRace()">結果を見る</button></div></div><script>
const initial={name:"サクラブレイズ",type:"speed",speed:55,power:50,stamina:50,energy:100,affection:3,coins:3000,wins:0};
let state;try{state={...initial,...JSON.parse(localStorage.getItem("derbyfarm-save")||"{}")}}catch{state={...initial}}
const labels={speed:"⚡ スピード",power:"🔥 パワー",stamina:"🌿 スタミナ"};
const races=[["11/15","エリザベス女王杯","stamina","芝2200m"],["11/22","マイルチャンピオンシップ","speed","芝1600m"],["11/29","ジャパンカップ","stamina","芝2400m"],["12/6","チャンピオンズカップ","power","ダ1800m"],["12/27","有馬記念","stamina","芝2500m"]];
let message="今日も元気いっぱい！",busy=false;const today=()=>new Date().toLocaleDateString("sv-SE");
function save(){localStorage.setItem("derbyfarm-save",JSON.stringify(state));render()}
function render(){document.getElementById("name").value=state.name;document.getElementById("typeLabel").textContent=labels[state.type]+"タイプ";document.getElementById("stats").innerHTML=[["⚡ スピード",state.speed],["🔥 パワー",state.power],["🌿 スタミナ",state.stamina],["💚 体力",state.energy]].map(([k,v])=>'<div class="stat"><span>'+k+'</span><progress max="100" value="'+Math.min(v,100)+'"></progress><b>'+v+'</b></div>').join("");document.getElementById("meta").textContent="💗 親愛度 "+'♥'.repeat(state.affection)+"　💰 "+state.coins+"　🏆 "+state.wins+"勝";document.getElementById("message").textContent=message;document.getElementById("daily").textContent=(state.lastBonus===today()?"本日のボーナスは受け取り済みです":"本日のボーナス：500コインを受け取れます！")+(state.lastRace?"　前走："+state.lastRace.name+" "+(state.lastRace.win?"優勝":"出走"):"")}
document.getElementById("name").addEventListener("change",e=>{state.name=e.target.value.trim()||"サクラブレイズ";save()});
function tab(id){for(const s of ["home","train","races"])document.getElementById(s).classList.toggle("hidden",s!==id);document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===id))}
function cheer(){const el=document.querySelector("#home .horse");el.classList.remove("happy");void el.offsetWidth;el.classList.add("happy");setTimeout(()=>el.classList.remove("happy"),1800)}
function pet(){cheer();state.affection=Math.min(5,state.affection+1);message="うれしそうに尻尾を振っている💕";save()}
function train(k){if(state.energy<15){message="疲れているので休養しよう";render();return}state.energy-=15;state[k]+=4;message=labels[k]+"が4上がった！";save()}
function rest(){cheer();state.energy=Math.min(100,state.energy+40);message="ゆっくり休んで元気になった！";save()}
function dailyBonus(){if(state.lastBonus===today()){message="今日はもう受け取り済みです";render();return}state.lastBonus=today();state.coins+=500;message="🎁 500コインを獲得！";save()}
function feed(){cheer();if(state.coins<100){message="コインが足りません";render();return}state.coins-=100;state.energy=Math.min(100,state.energy+15);state.affection=Math.min(5,state.affection+1);message="🥕 おいしそうに食べている！ 体力+15";save()}
function specialTrain(){if(state.coins<300||state.energy<30){message="特訓には300コインと体力30が必要です";render();return}state.coins-=300;state.energy-=30;state.speed+=5;state.power+=5;state.stamina+=5;message="⭐ 特訓成功！ 全能力+5";save()}
function changeType(k){cheer();state.type=k;message=labels[k]+"タイプになった！";save()}
function beats(a,b){return a==="speed"&&b==="stamina"||a==="stamina"&&b==="power"||a==="power"&&b==="speed"}
function race(i){if(busy)return;if(state.energy<20){message="出走には体力20以上が必要です";render();return}busy=true;const r=races[i];document.getElementById("raceScene").classList.remove("hidden");document.getElementById("finish").style.display="none";document.getElementById("raceTitle").textContent="🏁 "+r[1];document.getElementById("commentary").textContent="ゲートイン！ まもなくスタート！";const runners=document.querySelectorAll(".runner");runners.forEach(x=>x.classList.remove("go"));requestAnimationFrame(()=>requestAnimationFrame(()=>runners.forEach(x=>x.classList.add("go"))));setTimeout(()=>document.getElementById("commentary").textContent="第3コーナー！ 愛馬が前へ！",2000);setTimeout(()=>document.getElementById("commentary").textContent="最後の直線！ ゴールは目前！",4000);setTimeout(()=>{const base=(state.speed+state.power+state.stamina)/3;const bonus=state.type===r[2]?20:beats(state.type,r[2])?12:-12;const first=base+bonus+Math.floor(Math.random()*41-20)>=73;state.energy-=20;state.coins+=first?1200:100;if(first)state.wins++;message=r[1]+"： "+(first?"🏆 優勝！ 賞金1200":"健闘！ 賞金100");state.lastRace={name:r[1],win:first,date:today()};document.getElementById("commentary").textContent=message;document.getElementById("finish").style.display="inline-block";save()},5100)}
function closeRace(){busy=false;document.getElementById("raceScene").classList.add("hidden");tab("races")}
document.getElementById("raceList").innerHTML=races.map((r,i)=>'<div class="race"><strong>'+r[0]+' '+r[1]+'</strong><small>'+r[3]+' · '+labels[r[2]]+'型</small><button class="primary" onclick="race('+i+')">🏇 出走する</button></div>').join("");
render();
</script></body></html>
