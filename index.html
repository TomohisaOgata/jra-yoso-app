<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JRA予想ラボ</title><style>body{margin:0;background:#eef3f4;color:#18303d;font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{background:#143443;color:white;padding:22px}main{max-width:700px;margin:auto;padding:14px}section{background:white;padding:16px;margin:12px 0;border-radius:12px}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0 0 12px}label{display:block;margin:10px 0 4px;font-size:13px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #b8c9d0;border-radius:8px;padding:10px;font:inherit}textarea{height:170px;font-size:13px}button{background:#08766c;color:white;border:0;border-radius:9px;padding:13px 18px;font-weight:bold;font-size:16px;margin:10px 5px 5px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{font-size:13px;color:#526d78;line-height:1.6}.warn{background:#fff2d8;padding:10px;border-radius:8px}.horse{padding:10px;border-bottom:1px solid #ddd}.mark{color:#b45118;font-weight:bold}#status{color:#08766c;font-size:14px}a{color:#08766c}</style></head><body><header><h1>🏇 JRA予想ラボ</h1><small>中央競馬専用・試作版 v0.5</small></header><main><section><h2>レース設定</h2><div class="grid"><div><label>開催日</label><input type="date" id="date"></div><div><label>競馬場</label><select id="course"><option>東京</option><option>中山</option><option>京都</option><option>阪神</option><option>中京</option><option>新潟</option><option>福島</option><option>小倉</option><option>札幌</option><option>函館</option></select></div><div><label>レース</label><select id="race"></select></div><div><label>馬場</label><select id="going"><option>良</option><option>稍重</option><option>重</option><option>不良</option></select></div><div><label>コース</label><select id="surface"><option>ダート</option><option>芝</option></select></div><div><label>距離（m）</label><input type="number" id="distance" value="1800"></div></div></section><section><h2>出走馬を入力</h2><p class="hint warn">以下は架空のテストデータです。JRAの出走表・オッズはまだ自動取得できません。</p><p class="hint">1行ずつ「馬番,馬名,単勝オッズ,脚質,父,斤量,近走評価(0〜100)」を入力してください。脚質は逃げ・先行・差し・追込。</p><textarea id="horses">1,サンプルA,4.2,先行,シニスターミニスター,57,76
2,サンプルB,7.8,差し,キズナ,57,80
3,サンプルC,12.5,逃げ,ヘニーヒューズ,56,68
4,サンプルD,3.1,追込,ドゥラメンテ,58,82
5,サンプルE,19.0,先行,シニスターミニスター,55,72</textarea><button id="analyze">予想を分析する</button><button id="clear" style="background:#687d87">入力を消去</button><p id="status">読み込み中...</p></section><section id="result" hidden><h2>最終予想</h2><div id="predictions"></div><p id="pace" class="hint"></p><button id="copy">印をコピー</button><button id="save" style="background:#687d87">履歴に保存</button></section><section><h2>予想履歴</h2><div id="history" class="hint">保存履歴なし</div></section><section><h2>ご注意</h2><p class="hint">JRA非公式の試作品です。近走評価など手入力値に基づく簡易スコアで、AI学習済みの予測ではありません。的中・利益を保証しません。実際の馬番・馬名・オッズは<a href="https://www.jra.go.jp/">JRA公式サイト</a>で確認してください。</p></section></main><script>
(function () {
  "use strict";
  function el(id) { return document.getElementById(id); }
  function message(value) { el("status").textContent = value; }
  function safe(value) { return String(value).replace(/[&<>"]/g, function(c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  var current = new Date();
  el("date").value = current.getFullYear()+"-"+String(current.getMonth()+1).padStart(2,"0")+"-"+String(current.getDate()).padStart(2,"0");
  for (var n=1;n<=12;n++) { var option=document.createElement("option"); option.value=n;option.textContent=n+"R";el("race").appendChild(option); }
  var latest="";
  function showHistory() {
    try { var items=JSON.parse(localStorage.getItem("jra-history")||"[]"); el("history").textContent=items.join("\n")||"保存履歴なし";el("history").style.whiteSpace="pre-wrap"; }
    catch(error) { el("history").textContent="保存履歴を読み込めません"; }
  }
  function analyze() {
    try {
      var lines=el("horses").value.trim().split(/\r?\n/).filter(Boolean);
      if(lines.length<2)throw new Error("出走馬を2頭以上入力してください");
      var used={};
      var horses=lines.map(function(line,index) {
        var p=line.split(",").map(function(v){return v.trim();});
        if(p.length!==7)throw new Error((index+1)+"行目：7項目入力してください");
        var num=Number(p[0]),odds=Number(p[2]),weight=Number(p[5]),form=Number(p[6]);
        if(!Number.isInteger(num)||num<1||num>18||used[num])throw new Error("馬番が不正または重複しています");
        used[num]=true;
        if(!p[1]||!["逃げ","先行","差し","追込"].includes(p[3])||!(odds>1)||!(weight>=45&&weight<=65)||!(form>=0&&form<=100))throw new Error((index+1)+"行目のデータを確認してください");
        return {num:num,name:p[1],odds:odds,style:p[3],sire:p[4],weight:weight,form:form};
      });
      var front=horses.filter(function(h){return h.style==="逃げ"||h.style==="先行";}).length;
      var fast=front>=Math.ceil(horses.length*0.55),slow=front<=1;
      horses.forEach(function(h){
        h.score=h.form*0.8+Math.max(-5,Math.min(5,(57-h.weight)*1.1));
        if(fast&&(h.style==="差し"||h.style==="追込"))h.score+=4;
        if(slow&&(h.style==="逃げ"||h.style==="先行"))h.score+=4;
        if(el("surface").value==="ダート"&&h.sire==="シニスターミニスター")h.score+=2;
      });
      horses.sort(function(a,b){return b.score-a.score;});
      var marks=["◎","○","▲","☆","△","△","△"];
      latest=horses.slice(0,7).map(function(h,i){return (marks[i]||"△")+h.num+"番"+h.name;}).join(" / ");
      el("predictions").innerHTML=horses.map(function(h,i){return '<div class="horse"><span class="mark">'+(marks[i]||"・")+'</span> '+safe(h.num+"番 "+h.name)+' <small>('+h.score.toFixed(1)+'点 / '+h.odds+'倍)</small></div>';}).join("");
      el("pace").textContent="展開予想："+(fast?"ハイペース寄り":slow?"スローペース寄り":"平均ペース")+"（脚質数に基づく簡易推定）";
      el("result").hidden=false;message("分析完了："+horses.length+"頭");
    } catch(error) { message("入力エラー："+error.message);el("result").hidden=true; }
  }
  el("analyze").addEventListener("click",analyze);
  el("clear").addEventListener("click",function(){el("horses").value="";el("result").hidden=true;message("入力を消去しました");});
  el("copy").addEventListener("click",function(){if(navigator.clipboard){navigator.clipboard.writeText(latest).then(function(){message("コピーしました");},function(){message("コピーできませんでした");});}else{message("このブラウザではコピーできません");}});
  el("save").addEventListener("click",function(){try{var items=JSON.parse(localStorage.getItem("jra-history")||"[]");items.unshift(el("date").value+" "+el("course").value+el("race").value+"R "+latest);localStorage.setItem("jra-history",JSON.stringify(items.slice(0,20)));showHistory();message("保存しました");}catch(error){message("保存できませんでした");}});
  showHistory();
  message("計算機能の読み込み完了・v0.5");
})();
</script></body></html>
