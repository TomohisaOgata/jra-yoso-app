<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>エージェント育成バトル</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f3f5ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:500px;margin:auto;padding:20px 16px 60px}h1{font-size:25px;margin:8px 0 20px}h2{font-size:18px;margin:0 0 12px}.card{background:#171e33;border:1px solid #303c5c;border-radius:20px;padding:17px;margin:14px 0}.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pick button{background:#25314d}.pick button.on{background:#674bc1;box-shadow:inset 0 0 0 2px #b8a7ff}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:0;border-radius:13px;padding:14px 9px;color:white;font-size:16px;font-weight:750}.training{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.training button{background:#33476d;font-size:14px;min-height:66px}.stage{text-align:center;background:radial-gradient(circle at 50% 30%,#3b4272,#171e33 70%);min-height:220px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-direction:column}.character{font-size:110px;line-height:1.4}.name{font-size:22px;font-weight:800}.stat{display:flex;justify-content:space-between;margin:12px 0 6px}.meter{height:9px;background:#303b56;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#8070ff,#6cddff);width:0;transition:width .2s}.result{padding:14px;background:#293652;border-radius:12px;margin-top:12px;min-height:52px}.small{font-size:12px;color:#abb6d3}.modal{position:fixed;inset:0;background:#060912e9;z-index:5;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{background:#19233b;border:1px solid #43537a;border-radius:22px;padding:22px;width:min(100%,420px);text-align:center}.scene{font-size:94px;min-height:155px;display:flex;align-items:center;justify-content:center;animation:bob .65s infinite alternate}@keyframes bob{to{transform:translateY(-9px)}}.close{background:#775ae4;width:100%;margin-top:16px}.badge{font-size:23px;font-weight:850;color:#ffda78}.reset{background:#293249;color:#bfc9df;font-size:13px;margin-top:10px}img.agent{width:190px;max-height:220px;object-fit:contain}img.train{width:240px;max-height:270px;object-fit:contain}
</style></head><body><main><h1>⚔️ エージェント育成バトル</h1><div class="pick"><button id="blackBtn" class="on" type="button">💜 ノワール</button><button id="blondeBtn" type="button">💛 ルミナ</button></div><section class="card"><div class="stage"><div id="avatar" class="character">👩🏻‍🎤</div><div id="agentName" class="name">ノワール</div><div class="small">エージェント育成中</div></div></section><section class="card"><h2>ステータス</h2><div id="stats"></div><div id="result" class="result" role="status">特訓を選んでください。</div></section><section class="card"><h2>特訓を選択</h2><div class="training"><button type="button" data-train="speed">⚡<br>スピード<br>抜刀術</button><button type="button" data-train="power">💪<br>パワー<br>ダンベル</button><button type="button" data-train="stamina">🏃<br>スタミナ<br>走り込み</button></div><p class="small">通常成功80%：＋5 ／ 大成功20%：＋10</p></section><section class="card"><h2>育成記録</h2><div id="history" class="small">まだ記録がありません。</div><button id="reset" type="button" class="reset">選択中のエージェントを初期化</button></section><p class="small">このWeb版はSafariでJavaScriptと保存機能が有効な場合に動作します。</p></main><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="dialog"><div id="scene" class="scene">⚔️</div><div id="outcome" class="badge"></div><div id="detail" style="margin-top:12px"></div><button class="close" id="close" type="button">特訓を終える</button></div></div><script>
(function(){
'use strict';
var KEY='agent_ikusei_battle_web_v1';
function fresh(){return {black:{speed:30,power:30,stamina:30,history:[]},blonde:{speed:30,power:30,stamina:30,history:[]}}}
var data=fresh(),selected='black';
try{var old=JSON.parse(localStorage.getItem(KEY));if(old&&old.black&&old.blonde){['black','blonde'].forEach(function(k){['speed','power','stamina'].forEach(function(s){if(Number.isFinite(old[k][s]))data[k][s]=old[k][s]});if(Array.isArray(old[k].history))data[k].history=old[k].history.slice(0,20)})}}catch(e){}
var $=function(id){return document.getElementById(id)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function render(){
$('blackBtn').className=selected==='black'?'on':'';$('blondeBtn').className=selected==='blonde'?'on':'';
$('agentName').textContent=selected==='black'?'ノワール':'ルミナ';
$('avatar').textContent=selected==='black'?'👩🏻‍🎤':'👱🏻‍♀️';
var a=data[selected],html='';
[['speed','⚡ スピード'],['power','💪 パワー'],['stamina','💚 スタミナ']].forEach(function(item){var v=a[item[0]];html+='<div class="stat"><span>'+item[1]+'</span><strong>'+v+'</strong></div><div class="meter"><div class="fill" style="width:'+Math.min(100,v/3)+'%"></div></div>'});
$('stats').innerHTML=html;$('history').textContent=a.history.length?a.history.join(' ／ '):'まだ記録がありません。';
}
function choose(k){selected=k;render();$('result').textContent=(k==='black'?'ノワール':'ルミナ')+'を選択しました。'}
function train(kind){
var a=data[selected],before=a[kind],great=Math.random()<.2,gain=great?10:5;
a[kind]=before+gain;
var label={speed:'スピード',power:'パワー',stamina:'スタミナ'}[kind],who=selected==='black'?'ノワール':'ルミナ';
var message=who+' '+label+' '+before+' → '+a[kind]+'（＋'+gain+'）';
a.history.unshift(message);a.history=a.history.slice(0,20);save();render();
$('result').textContent=(great?'🎉 大成功！ ':'成功！ ')+message;
$('scene').textContent=({speed:'⚔️',power:'🏋️',stamina:'🏃'})[kind];
$('outcome').textContent=great?'🎉 大成功！ +10':'成功！ +5';
$('detail').textContent=message;
$('modal').classList.add('open');
}
$('blackBtn').addEventListener('click',function(){choose('black')});
$('blondeBtn').addEventListener('click',function(){choose('blonde')});
Array.prototype.forEach.call(document.querySelectorAll('[data-train]'),function(b){b.addEventListener('click',function(){train(b.getAttribute('data-train'))})});
$('close').addEventListener('click',function(){$('modal').classList.remove('open')});
$('reset').addEventListener('click',function(){data[selected]={speed:30,power:30,stamina:30,history:[]};save();render();$('result').textContent='初期化しました。'});
render();
})();
</script></body></html>
