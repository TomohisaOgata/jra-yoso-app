<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffe2e9"><meta name="apple-mobile-web-app-capable" content="yes"><title>ダービー牧場</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(#ffe6ef,#f8fff0);color:#55372e;min-height:100dvh}main{max-width:560px;margin:auto;padding:18px 16px 100px}h1{text-align:center;font-size:28px;margin:12px 0 18px}.panel{background:#fffdfb;border:2px solid #f5d6db;border-radius:23px;padding:18px;margin:13px 0;box-shadow:0 7px 18px #b45b6520}.horse{position:relative;text-align:center;background:linear-gradient(#d9f6ff 0 60%,#c4e5ad 60%);border-radius:22px;padding:22px 0 12px;overflow:hidden}.horse .emoji{font-size:112px;line-height:1.3;display:block;filter:drop-shadow(3px 6px 3px #6c774944)}.horse .flowers{position:absolute;top:8px;width:100%;font-size:23px}.horse .heart{font-size:22px}input{width:100%;font-size:20px;border:1px solid #e5bec5;border-radius:12px;padding:12px;background:white}button{border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:#f7a8b8;color:#54272f;cursor:pointer}button:active{transform:scale(.97)}button:disabled{opacity:.45}.primary{background:#f27798;color:white}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;gap:10px}.stat{display:flex;align-items:center;gap:8px;font-weight:650}.stat span{width:110px}.stat progress{flex:1;accent-color:#e97d97;height:15px}.stat b{width:30px;text-align:right}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdfbf2;display:flex;justify-content:center;padding:10px 8px max(12px,env(safe-area-inset-bottom));border-top:1px solid #f2c9d2}.nav button{background:transparent;width:33%;max-width:170px}.nav button.active{background:#fbd4df}.hidden{display:none}.race{padding:13px 0;border-bottom:1px solid #f3dce0}.race:last-child{border:0}.race small{display:block;color:#8b7770;margin:7px 0}.track{height:210px;background:repeating-linear-gradient(#c3e8a6 0 50px,#b0dc8e 50px 53px);border-radius:16px;overflow:hidden;margin:14px 0}.runner{font-size:36px;height:51px;position:relative;left:0;transition:left 5s linear;white-space:nowrap}.runner.go{left:calc(100% - 65px)}.message{text-align:center;background:#fff3c9;padding:12px;border-radius:12px;margin-top:14px}.badge{display:inline-block;background:#ffe6b2;border-radius:30px;padding:5px 10px;font-size:14px}#raceScene{position:fixed;inset:0;background:#fff7f9;z-index:5;padding:30px 16px;overflow:auto}#raceScene .wrap{max-width:560px;margin:auto;text-align:center}
.horse-art{width:min(100%,330px);height:245px;overflow:visible;filter:drop-shadow(0 6px 4px #61452a30);animation:horseFloat 2.3s ease-in-out infinite;transform-origin:50% 80%}.horse-art .horse-body{transform-origin:50% 80%}.horse-art.running .horse-body{animation:horseRun .34s ease-in-out infinite alternate}.horse-art.happy{animation:horseHappy .42s ease-in-out 4}.training-stage{position:relative;text-align:center;border-radius:20px;overflow:hidden;padding:15px;background:linear-gradient(#cceeff 0 65%,#a8d78c 65%)}.training-stage .horse-art{height:215px}.training-stage.speed{background:linear-gradient(#c5edff 0 63%,#d5aa78 63%)}.training-stage.power{background:linear-gradient(#ffdeb7 0 63%,#9acb86 63%)}.training-stage.stamina{background:linear-gradient(#c9f5e0 0 63%,#b1d89b 63%)}.training-stage .horse-art{animation:horseFloat 2.3s ease-in-out infinite}.training-stage.working .horse-art{animation:horseRun .33s ease-in-out infinite alternate}.train-progress{height:17px;width:100%;accent-color:#e97d97}.train-note{text-align:center;font-weight:700;min-height:28px}@keyframes horseFloat{50%{transform:translateY(-7px) rotate(-1deg)}}@keyframes horseRun{from{transform:translateY(2px) rotate(-3deg)}to{transform:translateY(-13px) rotate(3deg)}}@keyframes horseHappy{50%{transform:translateY(-24px) rotate(4deg)}}@media(prefers-reduced-motion:reduce){.horse-art,.horse-art .horse-body,.training-stage.working .horse-art{animation:none}}</style><style id="visual-v2">
:root{--ink:#59412f;--rose:#ee8fa5;--cream:#fff9ec;--green:#7eae74}
body{background:linear-gradient(180deg,#b8e6f3 0%,#f1f9e9 48%,#fff4e6 100%);color:var(--ink)}
main{max-width:480px;padding:12px 14px 120px}
h1{font-size:25px;letter-spacing:.09em;color:#76503d;margin:10px 0 15px;text-shadow:0 2px #fff}
.panel{border:2px solid #fff;background:#fffaf1;border-radius:27px;padding:16px;box-shadow:0 8px 0 #d9bca657,0 15px 30px #6d51321a}
#home .panel{padding:13px}
#home #name{background:#fffaf6;text-align:center;border:2px solid #f5d2c0;border-radius:20px;font-size:22px;font-weight:800;color:#8e5a43;margin-bottom:10px}
.horse{height:330px;border:3px solid #fff;border-radius:26px;background:radial-gradient(circle at 77% 18%,#fff5bd 0 34px,transparent 36px),linear-gradient(180deg,#a7e2f8 0%,#d9f7fc 59%,#92c981 59%,#b9d994 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:inset 0 -14px #85b76c}
.horse:before{content:"☁️";position:absolute;left:8%;top:20%;font-size:35px;opacity:.8}
.horse:after{content:"🌼  🌷  🌼  🌷  🌼";position:absolute;bottom:9px;left:0;right:0;font-size:20px}
.horse .flowers{top:10px;letter-spacing:13px;font-size:16px;opacity:.8}
.horse .heart{position:absolute;right:12px;top:45px;writing-mode:vertical-rl;letter-spacing:8px}
.horse .horse-art{height:260px;width:100%;max-width:340px;margin-top:20px}
#meta{background:#fff1d8;border-radius:15px;padding:12px;text-align:center;font-size:15px;font-weight:800}
.stats{grid-template-columns:1fr 1fr;gap:9px}
.stat{display:grid;grid-template-columns:1fr 34px;gap:4px;background:#fff3e5;padding:10px;border-radius:14px;font-size:12px}
.stat span{width:auto;grid-column:1/3}.stat progress{width:100%;height:13px;accent-color:#80b889}.stat b{font-size:13px}
button{border:2px solid #fff6ec;border-radius:18px;background:#f4c7a6;box-shadow:0 4px 0 #c58d78;color:#754934;min-height:53px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c58d78}
.primary{background:linear-gradient(#ffafbd,#ed829b);color:#fff;box-shadow:0 4px 0 #c66581;text-shadow:0 1px #ad526a}
.badge{background:#ffdfaa;border:2px solid white;font-weight:800;padding:8px 18px}
.nav{max-width:480px;left:50%;transform:translateX(-50%);background:#fff9effa;border:2px solid #fff;border-radius:23px 23px 0 0;box-shadow:0 -5px 20px #8a664025;gap:4px;padding:9px 7px max(12px,env(safe-area-inset-bottom))}
.nav button{font-size:12px;box-shadow:none;border:0;border-radius:14px;min-height:56px;color:#88654f}
.nav button.active{background:#f9d8d9;color:#b95370}
#train h2,#races h2{margin:4px 0 13px;text-align:center;color:#986447}
.training-stage{height:300px;border:3px solid #fff;background:linear-gradient(#afe8f6 0 63%,#a4d58b 63%);display:flex;align-items:center;justify-content:center;flex-direction:column}
.training-stage .horse-art{height:210px;width:100%}
.train-note{background:#fff9e6d9;padding:5px 10px;border-radius:12px}
.train-progress{height:12px}
.actions button{font-size:14px}
.race{background:#fff3df;border:1px solid #f0dcc6;padding:15px;border-radius:17px;margin:10px 0}
.race small{font-size:13px}
.message{background:#fff1cb;border:2px solid #fff;border-radius:17px;color:#8b6743;font-weight:700}
#raceScene{background:linear-gradient(#c2e7f3,#fff4e4)}
</style></head><body><main><h1>🌸 ダービー牧場 🌸</h1><section id="home"><div class="panel"><input id="name" aria-label="愛馬の名前" maxlength="20"><div class="horse"><div class="flowers">🌸 🌼 🌸 🌼 🌸</div><svg class="horse-art" viewBox="0 0 320 245" xmlns="http://www.w3.org/2000/svg" aria-label="可愛い栗毛の愛馬"><ellipse cx="161" cy="221" rx="95" ry="11" fill="#6d805b" opacity=".2"/><g class="horse-body"><path d="M116 128 Q78 119 68 157 Q48 187 61 198" stroke="#864324" stroke-width="17" fill="none" stroke-linecap="round"/><ellipse cx="161" cy="153" rx="74" ry="53" fill="#bc6c37"/><path d="M119 175 L113 219 M191 175 L201 219" stroke="#9b542d" stroke-width="20" stroke-linecap="round"/><path d="M117 219 h24 M195 219 h24" stroke="#55352b" stroke-width="13" stroke-linecap="round"/><path d="M180 133 Q214 98 218 67" stroke="#bc6c37" stroke-width="45" fill="none" stroke-linecap="round"/><path d="M198 97 Q185 78 201 56 L222 74" fill="#754126"/><ellipse cx="220" cy="64" rx="40" ry="42" fill="#c77b43"/><path d="M192 34 L193 5 Q214 12 218 35 M231 31 L249 5 Q258 26 250 44" fill="#bc6c37" stroke="#99552d" stroke-width="3"/><path d="M199 16 L202 31 M244 17 L239 31" stroke="#e9a78a" stroke-width="7"/><ellipse cx="237" cy="83" rx="28" ry="20" fill="#e7aa7b"/><circle cx="206" cy="58" r="6" fill="#35251d"/><circle cx="208" cy="56" r="2" fill="white"/><circle cx="251" cy="82" r="3" fill="#784b37"/><path d="M233 94 Q242 100 249 94" fill="none" stroke="#8e543d" stroke-width="2"/><path d="M205 22 Q225 10 238 27" fill="none" stroke="#6f3c25" stroke-width="11" stroke-linecap="round"/><path d="M158 116 Q169 131 174 139" stroke="#df945c" stroke-width="10" stroke-linecap="round"/></g></svg><div class="heart">💕 💕 💕</div></div><p style="text-align:center"><span class="badge" id="typeLabel"></span></p><div class="stats" id="stats"></div><p id="meta"></p><button class="primary" style="width:100%" onclick="pet()">🥕 なでなでする</button></div></section><section id="train" class="hidden"><div class="panel"><h2>🏋️ 調教</h2><div id="trainingStage" class="training-stage"><svg class="horse-art" viewBox="0 0 320 245" xmlns="http://www.w3.org/2000/svg" aria-label="可愛い栗毛の愛馬"><ellipse cx="161" cy="221" rx="95" ry="11" fill="#6d805b" opacity=".2"/><g class="horse-body"><path d="M116 128 Q78 119 68 157 Q48 187 61 198" stroke="#864324" stroke-width="17" fill="none" stroke-linecap="round"/><ellipse cx="161" cy="153" rx="74" ry="53" fill="#bc6c37"/><path d="M119 175 L113 219 M191 175 L201 219" stroke="#9b542d" stroke-width="20" stroke-linecap="round"/><path d="M117 219 h24 M195 219 h24" stroke="#55352b" stroke-width="13" stroke-linecap="round"/><path d="M180 133 Q214 98 218 67" stroke="#bc6c37" stroke-width="45" fill="none" stroke-linecap="round"/><path d="M198 97 Q185 78 201 56 L222 74" fill="#754126"/><ellipse cx="220" cy="64" rx="40" ry="42" fill="#c77b43"/><path d="M192 34 L193 5 Q214 12 218 35 M231 31 L249 5 Q258 26 250 44" fill="#bc6c37" stroke="#99552d" stroke-width="3"/><path d="M199 16 L202 31 M244 17 L239 31" stroke="#e9a78a" stroke-width="7"/><ellipse cx="237" cy="83" rx="28" ry="20" fill="#e7aa7b"/><circle cx="206" cy="58" r="6" fill="#35251d"/><circle cx="208" cy="56" r="2" fill="white"/><circle cx="251" cy="82" r="3" fill="#784b37"/><path d="M233 94 Q242 100 249 94" fill="none" stroke="#8e543d" stroke-width="2"/><path d="M205 22 Q225 10 238 27" fill="none" stroke="#6f3c25" stroke-width="11" stroke-linecap="round"/><path d="M158 116 Q169 131 174 139" stroke="#df945c" stroke-width="10" stroke-linecap="round"/></g></svg><div id="trainingNote" class="train-note">調教を選んでください 🌸</div><progress id="trainingProgress" class="train-progress" max="100" value="0"></progress></div><p>体力を使って能力アップ！</p><div class="actions"><button onclick="train('speed')">⚡ スピード調教</button><button onclick="train('power')">🔥 パワー調教</button><button onclick="train('stamina')">🌿 スタミナ調教</button><button onclick="rest()">🌱 放牧・休養</button></div><h3>愛馬のタイプ</h3><div class="actions"><button onclick="changeType('speed')">⚡ スピード</button><button onclick="changeType('power')">🔥 パワー</button><button onclick="changeType('stamina')">🌿 スタミナ</button></div><p>⚡ スピード → 🌿 スタミナ → 🔥 パワー → ⚡ スピード</p></div></section><section id="races" class="hidden"><div class="panel"><h2>🏆 JRA主要GIレース</h2><p>開催日を参考にしたゲーム内レースです。</p><div id="raceList"></div></div></section><div class="message" id="message" role="status"></div></main><nav class="nav"><button class="active" data-tab="home" onclick="tab('home')">🐴 愛馬</button><button data-tab="train" onclick="tab('train')">🌟 調教</button><button data-tab="races" onclick="tab('races')">🏆 レース</button></nav><div id="raceScene" class="hidden"><div class="wrap"><h2 id="raceTitle"></h2><p id="commentary">まもなくスタート！</p><div class="track"><div class="runner">🐎</div><div class="runner">🐎</div><div class="runner">🐎</div><div class="runner">🐎</div></div><button id="finish" class="primary" style="display:none" onclick="closeRace()">結果を見る</button></div></div><script>
const initial={name:"サクラブレイズ",type:"speed",speed:55,power:50,stamina:50,energy:100,affection:3,coins:3000,wins:0};
let state;try{state={...initial,...JSON.parse(localStorage.getItem("derbyfarm-save")||"{}")}}catch{state={...initial}}
const labels={speed:"⚡ スピード",power:"🔥 パワー",stamina:"🌿 スタミナ"};
const races=[["11/15","エリザベス女王杯","stamina","芝2200m"],["11/22","マイルチャンピオンシップ","speed","芝1600m"],["11/29","ジャパンカップ","stamina","芝2400m"],["12/6","チャンピオンズカップ","power","ダ1800m"],["12/27","有馬記念","stamina","芝2500m"]];
let message="今日も元気いっぱい！",busy=false;
function save(){localStorage.setItem("derbyfarm-save",JSON.stringify(state));render()}
function render(){document.getElementById("name").value=state.name;document.getElementById("typeLabel").textContent=labels[state.type]+"タイプ";document.getElementById("stats").innerHTML=[["⚡ スピード",state.speed],["🔥 パワー",state.power],["🌿 スタミナ",state.stamina],["💚 体力",state.energy]].map(([k,v])=>'<div class="stat"><span>'+k+'</span><progress max="100" value="'+Math.min(v,100)+'"></progress><b>'+v+'</b></div>').join("");document.getElementById("meta").textContent="💗 親愛度 "+'♥'.repeat(state.affection)+"　💰 "+state.coins+"　🏆 "+state.wins+"勝";document.getElementById("message").textContent=message}
document.getElementById("name").addEventListener("change",e=>{state.name=e.target.value.trim()||"サクラブレイズ";save()});
function tab(id){for(const s of ["home","train","races"])document.getElementById(s).classList.toggle("hidden",s!==id);document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===id))}
function pet(){document.querySelector("#home .horse-art").classList.remove("happy");void document.querySelector("#home .horse-art").offsetWidth;document.querySelector("#home .horse-art").classList.add("happy");state.affection=Math.min(5,state.affection+1);message="うれしそうに尻尾を振っている💕";save()}
function train(k){if(busy)return;if(state.energy<15){message="疲れているので休養しよう";render();return}busy=true;tab("train");const stage=document.getElementById("trainingStage"),bar=document.getElementById("trainingProgress"),note=document.getElementById("trainingNote");stage.className="training-stage "+k+" working";bar.value=0;note.textContent=labels[k]+" 調教中…";let n=0;const timer=setInterval(()=>{n+=10;bar.value=n;if(n>=100){clearInterval(timer);stage.classList.remove("working");state.energy-=15;state[k]=Math.min(100,state[k]+4);note.textContent="✨ 大成功！ "+labels[k]+" +4";message=labels[k]+"が4上がった！";busy=false;save()}},140)}
function rest(){state.energy=Math.min(100,state.energy+40);message="ゆっくり休んで元気になった！";save()}
function changeType(k){state.type=k;message=labels[k]+"タイプになった！";save()}
function beats(a,b){return a==="speed"&&b==="stamina"||a==="stamina"&&b==="power"||a==="power"&&b==="speed"}
function race(i){if(busy)return;if(state.energy<20){message="出走には体力20以上が必要です";render();return}busy=true;const r=races[i];document.getElementById("raceScene").classList.remove("hidden");document.getElementById("finish").style.display="none";document.getElementById("raceTitle").textContent="🏁 "+r[1];document.getElementById("commentary").textContent="ゲートイン！ まもなくスタート！";const runners=document.querySelectorAll(".runner");runners.forEach(x=>x.classList.remove("go"));requestAnimationFrame(()=>requestAnimationFrame(()=>runners.forEach(x=>x.classList.add("go"))));setTimeout(()=>document.getElementById("commentary").textContent="第3コーナー！ 愛馬が前へ！",2000);setTimeout(()=>document.getElementById("commentary").textContent="最後の直線！ ゴールは目前！",4000);setTimeout(()=>{const base=(state.speed+state.power+state.stamina)/3;const bonus=state.type===r[2]?20:beats(state.type,r[2])?12:-12;const first=base+bonus+Math.floor(Math.random()*41-20)>=73;state.energy-=20;state.coins+=first?1200:100;if(first)state.wins++;message=r[1]+"： "+(first?"🏆 優勝！ 賞金1200":"健闘！ 賞金100");document.getElementById("commentary").textContent=message;document.getElementById("finish").style.display="inline-block";save()},5100)}
function closeRace(){busy=false;document.getElementById("raceScene").classList.add("hidden");tab("races")}
document.getElementById("raceList").innerHTML=races.map((r,i)=>'<div class="race"><strong>'+r[0]+' '+r[1]+'</strong><small>'+r[3]+' · '+labels[r[2]]+'型</small><button class="primary" onclick="race('+i+')">🏇 出走する</button></div>').join("");
render();
</script></body></html>
